<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro:bit 接続テスト</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #1a1a2e;
            color: white;
        }
        button {
            background: #00a86b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            margin: 10px;
        }
        pre {
            background: #0f0f1a;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            overflow-x: auto;
        }
        .status {
            font-size: 14px;
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
        }
        .connected { background: #00a86b; }
        .error { background: #c41e3a; }
    </style>
</head>
<body>
    <h1>🔌 micro:bit 接続テスト</h1>
    <button id="connectBtn">接続する</button>
    <button id="disconnectBtn" disabled>切断</button>
    <pre id="log">⚡ 準備完了</pre>
    <div id="status" class="status"></div>

    <script>
        const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        
        let device = null;
        let server = null;
        let char = null;
        let connected = false;
        
        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");
        const logDiv = document.getElementById("log");
        const statusDiv = document.getElementById("status");
        
        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const line = `[${time}] ${msg}`;
            logDiv.innerHTML = line + "\n" + logDiv.innerHTML;
            statusDiv.textContent = msg;
            statusDiv.className = isError ? "status error" : "status";
            console.log(line);
        }
        
        async function connect() {
            if (connected) return;
            
            try {
                log("🔍 Bluetoothデバイス検索中...");
                log("💡 デバイス選択ダイアログが開きます");
                
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [UART_SERVICE]
                });
                
                log(`✅ 選択: ${device.name || "Unknown"}`);
                
                device.addEventListener("gattserverdisconnected", () => {
                    log("🔌 切断されました", true);
                    connected = false;
                    char = null;
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                });
                
                log("🔗 GATT接続中...");
                server = await device.gatt.connect();
                log("✅ GATT接続完了");
                
                log("📡 サービス取得中...");
                const service = await server.getPrimaryService(UART_SERVICE);
                log("✅ サービス取得完了");
                
                log("✍️ Characteristic取得中...");
                const chars = await service.getCharacteristics();
                log(`📊 ${chars.length}個のCharacteristic`);
                
                for (const c of chars) {
                    log(`  ${c.uuid}: write=${c.properties.write}`);
                    if (c.properties.write || c.properties.writeWithoutResponse) {
                        char = c;
                        log(`✅ 書き込みChar選択: ${c.uuid}`);
                        break;
                    }
                }
                
                if (!char) {
                    throw new Error("書き込み不可");
                }
                
                // テスト送信
                const testData = new TextEncoder().encode("UP\n");
                await char.writeValue(testData);
                log("✅ テスト送信成功！");
                
                connected = true;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                log("🎉 接続完了！micro:bitのLEDが変わります");
                
            } catch (err) {
                if (err.message.includes("cancel") || err.message.includes("User cancelled")) {
                    log("⚠️ キャンセルされました。micro:bitが見つかりませんでした", true);
                    log("💡 micro:bitをペアリングモードで起動してください", true);
                } else {
                    log(`❌ エラー: ${err.message}`, true);
                }
                connected = false;
                char = null;
            }
        }
        
        function disconnect() {
            if (device && device.gatt?.connected) {
                device.gatt.disconnect();
            }
            connected = false;
            char = null;
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            log("切断しました");
        }
        
        connectBtn.onclick = connect;
        disconnectBtn.onclick = disconnect;
        
        if (!navigator.bluetooth) {
            log("❌ Web Bluetooth未対応 - Chromeが必要", true);
        }
        
        log("📌 接続ボタンを押してください");
        log("💡 micro:bitをペアリングモードで起動すると見つかりやすい");
    </script>
</body>
</html>
