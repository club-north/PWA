<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LoFi Control - micro:bit Car</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15,15,26,0.95);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .led {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff3333;
            transition: all 0.2s;
            box-shadow: 0 0 4px #ff3333;
        }

        .led.connected {
            background: #33ff33;
            box-shadow: 0 0 10px #33ff33;
        }

        .status-text {
            color: white;
            font-weight: 600;
            font-size: 15px;
        }

        button {
            background: #2c2c44;
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .connect-btn { background: #00a86b; }
        .disconnect-btn { background: #c41e3a; }

        .speed-panel {
            background: rgba(10,10,18,0.9);
            border-radius: 40px;
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .speed-label {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 12px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #2c2c44;
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #00a86b;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        .dpad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            max-width: 280px;
            margin: 0 auto 24px;
        }

        .pad-btn {
            background: rgba(30,30,50,0.95);
            border-radius: 60px;
            text-align: center;
            padding: 20px 0;
            font-size: 36px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            touch-action: manipulation;
        }

        .pad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        .stop-btn {
            background: #c41e3a;
            box-shadow: 0 8px 0 #8b1529;
        }

        .emergency-btn {
            width: 100%;
            background: #ff4444;
            padding: 14px;
            font-size: 18px;
            border-radius: 50px;
            margin-top: 8px;
        }

        .info {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
        }

        .debug {
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-top: 16px;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <div class="status-indicator">
                <div class="led" id="statusLed"></div>
                <span class="status-text" id="statusText">未接続</span>
            </div>
            <div>
                <button id="connectBtn" class="connect-btn">🔌 接続</button>
                <button id="disconnectBtn" class="disconnect-btn" disabled>切断</button>
            </div>
        </div>

        <div class="speed-panel">
            <div class="speed-label">
                <span>🐢 スピード</span>
                <span id="speedValue">2</span>
                <span>🐇</span>
            </div>
            <input type="range" id="speedSlider" min="0" max="4" step="1" value="2">
        </div>

        <div class="dpad">
            <div></div>
            <div class="pad-btn" data-dir="UP">▲</div>
            <div></div>
            <div class="pad-btn" data-dir="LEFT">◀</div>
            <div class="pad-btn stop-btn" data-dir="STOP">■</div>
            <div class="pad-btn" data-dir="RIGHT">▶</div>
            <div></div>
            <div class="pad-btn" data-dir="DOWN">▼</div>
            <div></div>
        </div>

        <button id="emergencyStop" class="emergency-btn">🛑 緊急停止</button>
        <div class="info">⚡ ボタンを押し続けると連続送信</div>
        <div class="debug" id="debugInfo">⚡ 準備完了</div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // ==========================================
            // LoFi Control と同じUUID設定
            // ==========================================
            const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
            // ★ LoFi Controlと同じ方法：TXで書き込み（6e400002-...）
            const TX_CHARACTERISTIC = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
            
            let device = null;
            let server = null;
            let writeCharacteristic = null;
            let connected = false;
            
            const statusLed = document.getElementById("statusLed");
            const statusText = document.getElementById("statusText");
            const connectBtn = document.getElementById("connectBtn");
            const disconnectBtn = document.getElementById("disconnectBtn");
            const emergencyStopBtn = document.getElementById("emergencyStop");
            const debugInfo = document.getElementById("debugInfo");
            
            let queue = [];
            let sending = false;
            
            function debugLog(msg, isError = false) {
                const timestamp = new Date().toLocaleTimeString();
                const logMsg = `[${timestamp}] ${msg}`;
                console.log(logMsg);
                if (debugInfo) {
                    debugInfo.innerHTML = logMsg;
                    debugInfo.style.color = isError ? '#ff8888' : '#88ff88';
                }
            }
            
            function updateUI(state) {
                if (state) {
                    statusLed.classList.add("connected");
                    statusText.textContent = "接続中";
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                } else {
                    statusLed.classList.remove("connected");
                    statusText.textContent = "未接続";
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                }
            }
            
            // LoFi Controlと同じ書き込み方式
            async function writeToMicrobit(data) {
                if (!writeCharacteristic || !connected) return false;
                try {
                    await writeCharacteristic.writeValue(data);
                    return true;
                } catch (e) {
                    debugLog(`送信エラー: ${e.message}`, true);
                    return false;
                }
            }
            
            async function processQueue() {
                if (sending) return;
                if (queue.length === 0) return;
                if (!connected || !writeCharacteristic) {
                    queue = [];
                    return;
                }
                sending = true;
                const cmd = queue.shift();
                try {
                    const encoder = new TextEncoder();
                    const data = encoder.encode(cmd);
                    await writeToMicrobit(data);
                    if (cmd.trim() !== "up" && cmd.trim() !== "down" && cmd.trim() !== "left" && cmd.trim() !== "right") {
                        debugLog(`📤 ${cmd.trim()}`);
                    }
                } catch (e) {}
                sending = false;
                setTimeout(processQueue, 50);
            }
            
            function sendCommand(cmd) {
                if (!connected || !writeCharacteristic) return;
                queue.push(cmd + "\n");
                processQueue();
            }
            
            function emergencyStop() {
                if (!connected) return;
                debugLog("🛑 緊急停止");
                sendCommand("up");
                sendCommand("down");
                sendCommand("left");
                sendCommand("right");
            }
            
            // ==========================================
            // ★ LoFi Controlと同じ接続方式
            // ==========================================
            async function connectBLE() {
                if (connected) return;
                
                if (!navigator.bluetooth) {
                    alert("ChromeまたはEdgeを使用してください");
                    return;
                }
                
                try {
                    debugLog("🔍 Bluetoothデバイス検索中...");
                    
                    // ★ LoFi Controlと同じ：acceptAllDevices + optionalServices
                    device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: [UART_SERVICE]
                    });
                    
                    debugLog(`✅ 選択: ${device.name || "micro:bit"}`);
                    
                    // 切断イベント
                    device.addEventListener("gattserverdisconnected", () => {
                        debugLog("🔌 Bluetooth切断", true);
                        connected = false;
                        writeCharacteristic = null;
                        updateUI(false);
                        queue = [];
                    });
                    
                    debugLog("🔗 GATT接続中...");
                    server = await device.gatt.connect();
                    debugLog("✅ GATT接続完了");
                    
                    debugLog("📡 UARTサービス取得中...");
                    const service = await server.getPrimaryService(UART_SERVICE);
                    debugLog("✅ サービス取得完了");
                    
                    // ★ LoFi Controlと同じ：動的に書き込み可能なcharacteristicを探す
                    const characteristics = await service.getCharacteristics();
                    debugLog(`📊 ${characteristics.length}個のCharacteristicを確認`);
                    
                    // 書き込み可能なcharacteristicを探す
                    for (const char of characteristics) {
                        debugLog(`  - ${char.uuid}: write=${char.properties.write}, writeWithoutResponse=${char.properties.writeWithoutResponse}`);
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            writeCharacteristic = char;
                            debugLog(`✅ 書き込み用Characteristicを選択: ${char.uuid}`);
                            break;
                        }
                    }
                    
                    if (!writeCharacteristic) {
                        throw new Error("書き込み可能なCharacteristicが見つかりません");
                    }
                    
                    connected = true;
                    updateUI(true);
                    debugLog("🎉 接続成功！");
                    
                    // 初期化
                    setTimeout(() => {
                        if (connected) {
                            emergencyStop();
                            const speedSlider = document.getElementById("speedSlider");
                            if (speedSlider) {
                                const val = parseInt(speedSlider.value);
                                const table = [0, 4, 8, 12, 15];
                                const mapped = table[val];
                                sendCommand("c" + String(mapped).padStart(2, "0"));
                            }
                            debugLog("🎮 操作可能です");
                        }
                    }, 500);
                    
                } catch (err) {
                    debugLog(`❌ 接続エラー: ${err.message}`, true);
                    if (!err.message.includes("cancel") && !err.message.includes("User cancelled")) {
                        alert(`接続エラー: ${err.message}`);
                    }
                    connected = false;
                    writeCharacteristic = null;
                    updateUI(false);
                }
            }
            
            function disconnectBLE() {
                if (device && device.gatt && device.gatt.connected) {
                    device.gatt.disconnect();
                }
                connected = false;
                writeCharacteristic = null;
                updateUI(false);
                queue = [];
                debugLog("切断完了");
            }
            
            function bindPad(dir, pressCmd, releaseCmd) {
                const btn = document.querySelector(`[data-dir="${dir}"]`);
                if (!btn) return;
                let repeatInterval = null;
                let isPressed = false;
                function start() {
                    if (!connected || isPressed) return;
                    isPressed = true;
                    sendCommand(pressCmd);
                    repeatInterval = setInterval(() => {
                        if (connected && isPressed) sendCommand(pressCmd);
                        else stop();
                    }, 150);
                }
                function stop() {
                    if (!isPressed) return;
                    isPressed = false;
                    if (repeatInterval) clearInterval(repeatInterval);
                    if (connected) sendCommand(releaseCmd);
                }
                btn.addEventListener("mousedown", start);
                btn.addEventListener("mouseup", stop);
                btn.addEventListener("mouseleave", stop);
                btn.addEventListener("touchstart", start, { passive: false });
                btn.addEventListener("touchend", stop);
            }
            
            let speedDebounce = null;
            let lastSpeedCmd = "";
            
            function sendSpeed(value) {
                if (!connected) return;
                const level = parseInt(value);
                const table = [0, 4, 8, 12, 15];
                const mapped = table[level] || 0;
                const cmd = "c" + String(mapped).padStart(2, "0");
                if (cmd === lastSpeedCmd) return;
                lastSpeedCmd = cmd;
                sendCommand(cmd);
            }
            
            const speedSlider = document.getElementById("speedSlider");
            const speedValueSpan = document.getElementById("speedValue");
            if (speedSlider) {
                speedSlider.addEventListener("input", (e) => {
                    if (speedValueSpan) speedValueSpan.textContent = e.target.value;
                    if (speedDebounce) clearTimeout(speedDebounce);
                    speedDebounce = setTimeout(() => sendSpeed(e.target.value), 100);
                });
            }
            
            document.querySelector('[data-dir="STOP"]')?.addEventListener("click", () => emergencyStop());
            emergencyStopBtn?.addEventListener("click", () => emergencyStop());
            
            bindPad("UP", "UP", "up");
            bindPad("DOWN", "DOWN", "down");
            bindPad("LEFT", "LEFT", "left");
            bindPad("RIGHT", "RIGHT", "right");
            
            connectBtn.onclick = connectBLE;
            disconnectBtn.onclick = disconnectBLE;
            
            updateUI(false);
            debugLog("✅ LoFi Control方式 PWA起動");
            debugLog("📌 接続ボタンを押してください");
            
            if (!navigator.bluetooth) {
                debugLog("❌ Web Bluetooth未対応", true);
            }
        })();
    </script>
</body>
</html>
